<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1020"><title>罗盘学习 · 易术堂</title><link rel="icon" href="../icon192.png"><link rel="stylesheet" href="style.css">
<script defer src="../guard.js"></script><script defer src="../reader.js"></script><script defer src="../notes.js"></script><script defer src="data.js"></script><script defer src="model.js"></script><script defer src="plate-data.js"></script><script defer src="dial.js"></script><script defer src="app.js"></script></head>
<body><header class="topbar"><a class="brand" href="#explore"><span class="brand-mark">盘</span><span>罗盘学习<small>认位置 · 读罗层 · 练坐向</small></span></a><div class="top-actions"><button class="quiet" data-act="settings">显示设置</button><a href="../index.html" target="_top">易术堂</a></div></header>
<main><section id="explore-view" class="view">
<div class="intro"><div><p class="kicker">罗盘研习室</p><h1>二十九层综合盘</h1></div><button class="button primary" data-act="daily">今日八题</button></div>
<div class="workbench">
<section class="instrument" aria-label="二十九层综合盘学习工具">
<div class="bearing"><div><span>前方 · 向</span><strong id="front-reading">辰向 东南115.7°</strong></div><div><span>后方 · 坐</span><strong id="back-reading">戌山 西北295.7°</strong></div></div>
<div class="dial-heading"><span id="stage-tag">地盘二十四山</span><button class="quiet" data-act="lock" id="board-lock" aria-pressed="false"><span>锁定朝向</span></button></div>
<div id="compass-stage" class="compass-stage" tabindex="0" aria-label="拖动旋转，双指缩放移动；方向键微调，长按查看罗层"><svg id="compass-svg" viewBox="0 0 1200 1200" role="img" aria-label="矢量学习盘与红色十字线"></svg></div>
<div class="board-controls"><button class="square" data-act="zoom-out" aria-label="缩小盘面">−</button><output id="zoom-value" aria-label="放大倍数">1×</output><button class="square" data-act="zoom-in" aria-label="放大盘面">＋</button><button class="quiet" data-act="focus-layer">看清本层</button><button class="quiet" data-act="reset-pan">全盘</button><button class="quiet" data-act="gesture" id="gesture-mode" aria-pressed="false">拖动：旋转</button></div>
<p class="gesture-help">拖动转盘 · 双指缩放移动 · 长按选层</p>
<div class="angle-control"><label for="bearing-number">前方度数</label><div><button class="square" data-step="-1" aria-label="减少一度">−1°</button><input id="bearing-number" type="number" min="0" max="360" step="0.1" value="115.7" inputmode="decimal"><span>°</span><button class="square" data-step="1" aria-label="增加一度">＋1°</button></div><input id="bearing-range" type="range" min="0" max="359.9" step="0.1" value="115.7" aria-label="前方朝向度数"></div>
<details class="mountain-shortcuts"><summary>二十四山快速定位</summary><div class="compass-jumps" id="mountain-jumps" aria-label="二十四山快速定位"></div></details>
<p class="source-small plate-status">拖动研习盘，熟悉每圈的位置；先看度数，再读红线所压的格。</p>
</section>
<aside class="desktop-panel"><div id="inline-panel" class="learning-panel"><div class="panel-heading"><p class="kicker">沿红线读盘</p><h2>选一圈，慢慢看清</h2></div><div class="ring-picker" id="ring-picker"></div><article class="reading-card" id="reading-card" aria-live="polite"></article><div class="learning-actions"><button class="button" data-act="focus-layer">放大这圈</button><button class="button" data-act="layer-quiz">练这个知识点</button></div><div class="study-tip"><span>试着先回想</span><p>先报前方，再找对面。每天把一圈读熟，比随手转一转更容易记住。</p><a href="#learn">读盘入门</a></div></div></aside>
</div><button class="mobile-layer-button button" data-act="layers">罗层与读数</button>
</section>
<div id="drawer-backdrop" class="drawer-backdrop" hidden></div><section id="settings-drawer" class="drawer" hidden aria-label="学习设置"><div class="drawer-head"><h2>学习设置</h2><button class="quiet" data-act="close-drawers">关闭</button></div><p class="source-small">手动学习盘，可输入实测度数练习读盘。</p><div class="top-actions drawer-shared"></div><div class="segmented"><button data-mode="full" aria-pressed="true">全盘显示</button><button data-mode="focus" aria-pressed="false">突出本层</button></div></section>
<section id="layers-drawer" class="drawer" hidden aria-label="罗层与讲解"><div class="drawer-head"><h2>罗层与读数</h2><button class="quiet" data-act="close-drawers">关闭</button></div><div id="drawer-panel"></div></section>
<section id="learn-view" class="view" hidden></section><section id="practice-view" class="view" hidden></section><section id="wrong-view" class="view" hidden></section></main>
<nav class="bottom-nav" aria-label="主导航"><a href="#explore" data-route="explore" aria-current="page"><span>盘</span>转盘</a><a href="#learn" data-route="learn"><span>读</span>学读盘</a><a href="#practice" data-route="practice"><span>练</span>跟练</a><a href="#wrong" data-route="wrong"><span>错</span>错题</a></nav>
<div id="toast" class="toast" role="status" hidden></div><dialog id="round-dialog"><h2>这一组还没做完</h2><p>继续原来的题，或保留已答记录，换一组。</p><div class="dialog-actions"><button class="button primary" data-act="resume-round">继续本组</button><button class="button" data-act="replace-round">换一组</button></div></dialog></body></html>
