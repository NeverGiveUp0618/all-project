<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>进度备份 · 易术堂</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg0:#05070f; --bg1:#0a1020;
    --gold:#d9b877; --gold-hi:#f4e6be; --gold-lo:#9a7d43;
    --cyan:#8fd3e0; --ink:#e9edf8; --ink-dim:#8a94ac;
    --line:rgba(217,184,119,.26);
    --panel:rgba(14,20,36,.55);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;padding:18px 16px calc(28px + var(--safe-b));
    background:radial-gradient(120% 80% at 50% 0%,var(--bg1) 0%,var(--bg0) 70%) fixed;
    color:var(--ink);font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh}
  a{color:var(--cyan);text-decoration:none}
  h1{font-size:19px;margin:0 0 2px;letter-spacing:.06em;color:var(--gold-hi)}
  .sub{color:var(--ink-dim);font-size:12.5px;margin-bottom:18px;line-height:1.7}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px;margin-bottom:14px}
  .panel h2{font-size:14px;margin:0 0 4px;color:var(--gold);letter-spacing:.08em}
  .tip{font-size:12px;color:var(--ink-dim);line-height:1.8;margin:6px 0 0}
  .btn{display:inline-block;padding:10px 16px;border-radius:9px;border:1px solid var(--line);
    background:rgba(217,184,119,.1);color:var(--gold-hi);font-size:14px;font-family:inherit;
    cursor:pointer;margin:8px 8px 0 0}
  .btn:active{background:rgba(217,184,119,.22)}
  .btn.main{background:rgba(143,211,224,.14);border-color:rgba(143,211,224,.4);color:var(--cyan)}
  .btn[disabled]{opacity:.4}
  textarea{width:100%;min-height:110px;margin-top:10px;padding:10px;border-radius:9px;
    border:1px solid var(--line);background:rgba(5,7,15,.6);color:var(--ink);
    font:11.5px/1.6 ui-monospace,Menlo,monospace;resize:vertical}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  td{padding:5px 2px;border-bottom:1px solid rgba(217,184,119,.12)}
  td:last-child{text-align:right;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
  .msg{margin-top:10px;font-size:13px;line-height:1.7;min-height:1.2em}
  .ok{color:#7fd6a8}.bad{color:#ff8f8f}.warn{color:var(--gold)}
  .foot{margin-top:26px;font-size:10.5px;letter-spacing:.2em;text-align:center;
    color:rgba(138,148,172,.5)}
</style>
</head>
<body>

<h1>进度备份</h1>
<div class="sub">
  学习进度只存在<b>这台设备的这个浏览器</b>里，不上服务器、不跨设备同步。<br>
  换手机、清缓存都会没——<b>换设备前先在这里导出，到新设备上导回去</b>。
</div>

<div class="panel">
  <h2>本机现有的进度</h2>
  <table id="list"></table>
  <div class="msg" id="sum"></div>
</div>

<div class="panel">
  <h2>① 导出</h2>
  <p class="tip">点「生成备份」，再选一种带走：<br>
  ⭐ <b>生成恢复链接</b>（最省事）：把链接发给自己，新手机点开就自动恢复，不用复制粘贴。<br>
  · <b>复制</b>：复制整段文本，发给自己保存。<br>
  · <b>存成文件</b>：微信内多半拦下载——那就点右上角「⋯」→<b>在浏览器中打开</b>，那里下载和复制都正常。</p>
  <button class="btn main" id="gen">生成备份</button>
  <button class="btn" id="copy" disabled>复制</button>
  <button class="btn" id="link" disabled>生成恢复链接</button>
  <button class="btn" id="dl" disabled>存成文件</button>
  <textarea id="out" placeholder="备份文本会出现在这里" readonly></textarea>
  <div class="msg" id="m1"></div>
</div>

<div class="panel">
  <h2>② 导入</h2>
  <p class="tip">把之前备份的文本<b>整段粘贴</b>到下面，再点「恢复」。默认是<b>合并</b>：只写回备份里有的项，本机其他数据不动。</p>
  <textarea id="in" placeholder="在这里粘贴备份文本"></textarea>
  <button class="btn main" id="imp">恢复</button>
  <button class="btn" id="file">从文件选</button>
  <input type="file" id="fi" accept=".json,.txt,application/json,text/plain" style="display:none">
  <div class="msg" id="m2"></div>
</div>

<div class="foot">易 术 堂 &nbsp;·&nbsp; <a href="./">返回导航</a> &nbsp;·&nbsp; <a href="check.html">数据自检</a></div>

<script>
'use strict';
var $ = function (s) { return document.querySelector(s); };
var ls = null;
try { ls = window.localStorage; } catch (e) {}

/* ⚠️ 这些键不备份：
   yst_stat_*  看板缓存，恢复后会自动重算，带过去反而会把旧文本钉住
   wst_last/wst_usage  只是"上次打开的是哪个"，换设备没意义 */
var SKIP = /^(yst_stat_|wst_last$|wst_usage$)/;

/* 各 App 认哪些键——只用来在界面上分组显示，导出仍以实际存在的键为准，
   将来 App 加了新键也不会漏备份。 */
var APPS = [
  ['八字日练',   /^bazi(_|$)(?!course_)/],
  ['命理精讲',   /^bazi_course_/],
  ['六壬课程',   /^liuren_course_/],
  ['六壬神课',   /^(lr_|bfStoryDone)/],
  ['风水识形',   /^guanshan_/],
  ['择日学习',   /^zeri/],
  ['杨公背诵',   /^yangpu/],
  ['象义随身',   /^bazi_xiangyi_/]
];

function allKeys() {
  var out = [];
  if (!ls) return out;
  for (var i = 0; i < ls.length; i++) {
    var k = ls.key(i);
    if (k && !SKIP.test(k)) out.push(k);
  }
  return out.sort();
}

function bytes(n) { return n < 1024 ? n + ' 字' : (n / 1024).toFixed(1) + ' KB'; }

function render() {
  var t = $('#list');
  if (!ls) {
    t.innerHTML = '<tr><td class="bad">这个浏览器禁止了本地存储（无痕模式？），读不到也存不了</td></tr>';
    return;
  }
  var keys = allKeys(), used = {}, rows = '', total = 0;
  APPS.forEach(function (a) {
    var n = 0, size = 0;
    keys.forEach(function (k) {
      if (used[k]) return;
      // ⚠️ 「八字日练」的规则要排掉 bazi_course_ 与 bazi_xiangyi_，先让更专的规则占位
      if (a[1].test(k)) { used[k] = 1; n++; size += (ls.getItem(k) || '').length; }
    });
    total += size;
    if (n) rows += '<tr><td>' + a[0] + '</td><td>' + bytes(size) + '</td></tr>';
  });
  var rest = keys.filter(function (k) { return !used[k]; });
  if (rest.length) {
    var rs = 0; rest.forEach(function (k) { rs += (ls.getItem(k) || '').length; });
    total += rs;
    rows += '<tr><td>其他</td><td>' + bytes(rs) + '</td></tr>';
  }
  t.innerHTML = rows || '<tr><td class="bad">一项都没有</td></tr>';
  $('#sum').innerHTML = keys.length
    ? '共 <b>' + keys.length + '</b> 项，' + bytes(total) + '。'
    : '<span class="bad">本机在这个网址下没有任何学习数据。</span>';
}

/* 更专的规则要先匹配，否则 bazi_course_* 会被「八字日练」的规则先吃掉 */
APPS.sort(function (a, b) { return b[1].source.length - a[1].source.length; });
render();

var payload = '';
$('#gen').onclick = function () {
  if (!ls) return;
  var keys = allKeys(), data = {};
  // ⚠️ 别直接存字符串：那样每个 " 都会被转义成 \"，整份备份凭空胖 13%。
  //    能解析成对象的就存对象，恢复时再 stringify 回去。
  keys.forEach(function (k) {
    var v = ls.getItem(k);
    try { data[k] = JSON.parse(v); } catch (e) { data[k] = v; }
  });
  payload = JSON.stringify({
    t: 'yishutang-backup', v: 2,
    at: new Date().toISOString().slice(0, 19).replace('T', ' '),
    host: location.host, n: keys.length, data: data
  });
  $('#out').value = payload;
  $('#copy').disabled = $('#dl').disabled = $('#link').disabled = !payload;
  $('#m1').innerHTML = '<span class="ok">已生成</span>：' + keys.length + ' 项，' +
    bytes(payload.length) + '。<b>请把下面这段文本整段复制保存</b>。';
};

$('#copy').onclick = function () {
  if (!payload) return;
  var m = $('#m1');
  function good() {
    m.innerHTML = '<span class="ok">已复制</span>（' + payload.length +
      ' 个字符）。发给自己保存，粘回去时<b>要一字不差</b>。';
  }
  function fail(why) {
    m.innerHTML = '<span class="warn">复制没成功</span>（' + why + '）。<br>' +
      '请<b>长按下面的文本框 → 全选 → 复制</b>；或者点「存成文件」。';
  }
  // ⚠️ 顺序很要紧：execCommand 在微信/iOS 上常常"返回 true 但剪贴板是空的"，
  //    先信它就会让人以为复制好了，粘出来却是别的东西。所以 clipboard API 优先，
  //    而且复制完回读一次校验，确认真进了剪贴板。
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(payload).then(function () {
      if (navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function (t) {
          if (t === payload) good();
          else fail('剪贴板里的内容对不上');
        }, good);   // 读不了剪贴板是常态（要权限），不算失败
      } else good();
    }, function () { legacy(); });
    return;
  }
  legacy();
  function legacy() {
    var el = $('#out');
    el.removeAttribute('readonly');
    el.focus();
    el.setSelectionRange(0, el.value.length);
    var done = false;
    try { done = document.execCommand('copy'); } catch (e) {}
    el.setAttribute('readonly', 'readonly');
    if (done) good(); else fail('这个浏览器不让脚本复制');
  }
};

/* ⭐ 恢复链接：把备份塞进 URL 的 # 后面。
   为什么要这条路——微信里复制长文本极不可靠（剪贴板被截断、execCommand 假成功），
   而"发一条链接给自己、在新手机上点开"是微信里最顺的操作。
   # 后面的内容不会发到服务器，只在浏览器本地解析。 */
// ⚠️ btoa 只吃 Latin-1，中文必须先转成 UTF-8 字节。
//    这里不用 TextEncoder——老一点的 webview 里没有；unescape/encodeURIComponent
//    这一对虽然是老写法，但从 iOS 到微信 X5 全都有。
function toB64(str) {
  return btoa(unescape(encodeURIComponent(str)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function fromB64(b) {
  var t = b.replace(/-/g, '+').replace(/_/g, '/');
  while (t.length % 4) t += '=';
  return decodeURIComponent(escape(atob(t)));
}

/* ⭐ gzip：实测一份重度使用的数据 base64 要 45000 字符（链接塞不下），
   gzip 后只要 6300 字符——省 86%，这才让"发链接"这条路真正可用。
   CompressionStream 是浏览器原生的，老 webview 没有就退回不压缩。 */
function gzipB64(str) {
  if (typeof CompressionStream === 'undefined' || typeof Blob === 'undefined') {
    return Promise.resolve(null);
  }
  try {
    var st = new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'));
    return new Response(st).arrayBuffer().then(function (buf) {
      var u = new Uint8Array(buf), bin = '';
      // 一次转几千个，别用 apply 一把梭——大数组会爆栈
      for (var i = 0; i < u.length; i += 8192) {
        bin += String.fromCharCode.apply(null, u.subarray(i, i + 8192));
      }
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }).catch(function () { return null; });
  } catch (e) { return Promise.resolve(null); }
}
function ungzipB64(b) {
  if (typeof DecompressionStream === 'undefined') return Promise.resolve(null);
  try {
    var t = b.replace(/-/g, '+').replace(/_/g, '/');
    while (t.length % 4) t += '=';
    var bin = atob(t), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    var st = new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(st).text().catch(function () { return null; });
  } catch (e) { return Promise.resolve(null); }
}

var FRAG = 3000;   // 每片的数据长度；再长有的聊天软件就开始截断了

$('#link').onclick = function () {
  if (!payload) return;
  $('#m1').textContent = '正在压缩…';
  gzipB64(payload).then(function (z) {
    var body, tag;
    if (z) { body = z; tag = 'z'; }
    else { body = toB64(payload); tag = 'r'; }      // 压不了就退回原样
    var base = location.origin + location.pathname;
    if (body.length <= FRAG) {
      var url = base + '#' + tag + '=' + body;
      $('#out').value = url;
      $('#m1').innerHTML = '<span class="ok">已生成恢复链接</span>（' + url.length + ' 字符' +
        (z ? '，已压缩 ' + Math.round((1 - z.length / toB64(payload).length) * 100) + '%' : '') +
        '）。<b>发给自己，新手机点开就自动恢复</b>。';
      return;
    }
    // 太大就切片：每条链接一片，按顺序点开，集齐自动合并
    var parts = [], i;
    for (i = 0; i < body.length; i += FRAG) parts.push(body.slice(i, i + FRAG));
    var urls = parts.map(function (p, k) {
      return base + '#' + tag + '=' + (k + 1) + '/' + parts.length + ',' + p;
    });
    $('#out').value = urls.join('\n\n');
    $('#m1').innerHTML = '<span class="ok">数据较多，切成了 ' + parts.length + ' 条链接</span>' +
      (z ? '（已压缩 ' + Math.round((1 - z.length / toB64(payload).length) * 100) + '%）' : '') +
      '。<b>把这 ' + parts.length + ' 条全发给自己，在新手机上一条条点开</b>——' +
      '点完最后一条就会自动拼好，中间顺序错了也不要紧。';
  });
};

$('#dl').onclick = function () {
  if (!payload) return;
  // ⚠️ 微信内置浏览器多半拦下载，所以这只是加分项，复制才是主力
  try {
    var b = new Blob([payload], { type: 'application/json' });
    var u = URL.createObjectURL(b), a = document.createElement('a');
    a.href = u; a.download = '易术堂进度-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 3000);
    $('#m1').innerHTML = '已触发下载。<b>微信里多半不给下</b>，那就用「复制」。';
  } catch (e) {
    $('#m1').innerHTML = '<span class="warn">这个浏览器不支持下载</span>，请用「复制」。';
  }
};

$('#file').onclick = function () { $('#fi').click(); };
$('#fi').onchange = function () {
  var f = this.files && this.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () { $('#in').value = String(r.result || ''); $('#m2').textContent = '已读入文件，点「恢复」。'; };
  r.readAsText(f);
};

/* 点开恢复链接进来：把数据填好并直接走恢复流程，不让人再手动粘一次 */
/* 点开恢复链接进来。三种形态：
     #r=xxx          未压缩、单条
     #z=xxx          gzip、单条
     #z=2/5,xxx      gzip、第 2 片（共 5 片）——分片暂存在 localStorage，集齐自动合并 */
var FRAG_KEY = '_yst_frag';
(function () {
  var h = location.hash || '';
  var m = /^#([rz])=(.*)$/.exec(h);
  if (!m) return;
  var tag = m[1], body = m[2];
  var fm = /^(\d+)\/(\d+),([\s\S]*)$/.exec(body);

  if (fm) {
    var idx = +fm[1], total = +fm[2], part = fm[3];
    var box = {};
    try { box = JSON.parse(ls.getItem(FRAG_KEY) || '{}'); } catch (e) {}
    if (box.total !== total || box.tag !== tag) box = { total: total, tag: tag, parts: {} };
    box.parts[idx] = part;
    try { ls.setItem(FRAG_KEY, JSON.stringify(box)); } catch (e) {}
    var have = Object.keys(box.parts).length;
    if (have < total) {
      var miss = [];
      for (var i = 1; i <= total; i++) if (!box.parts[i]) miss.push(i);
      $('#m2').innerHTML = '<span class="ok">已收到第 ' + idx + ' 片</span>（' + have + '/' + total +
        '）。<b>还差第 ' + miss.join('、') + ' 片</b>，把剩下的链接也点开。';
      return;
    }
    body = '';
    for (var j = 1; j <= total; j++) body += box.parts[j];
    try { ls.removeItem(FRAG_KEY); } catch (e) {}   // 拼好就把碎片清掉，别占地方
  }

  function done(raw) {
    if (!raw) {
      $('#m2').innerHTML = '<span class="bad">这个恢复链接是坏的</span>——多半是发送时被截断了。';
      return;
    }
    $('#in').value = raw;
    $('#m2').innerHTML = '<span class="ok">从链接读到了备份</span>，点下面的「恢复」写入本机。';
    try { $('#imp').scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
  }
  if (tag === 'z') {
    $('#m2').textContent = '正在解压…';
    ungzipB64(body).then(function (t) {
      if (t) return done(t);
      $('#m2').innerHTML = '<span class="bad">这个浏览器解不开压缩包</span>——' +
        '请在导出的那台手机上改用「复制」或「存成文件」。';
    });
  } else {
    var raw = null;
    try { raw = fromB64(body); } catch (e) {}
    done(raw);
  }
})();

$('#imp').onclick = function () {
  if (!ls) return;
  var raw = $('#in').value.trim();
  if (!raw) { $('#m2').innerHTML = '<span class="bad">先粘贴备份文本</span>'; return; }
  // ⚠️ 粘贴常带杂质：微信/输入法可能塞进零宽字符，聊天软件会把 " 变成中文引号，
  //    有的还会在首尾加空格或把长文本截断。先洗一遍，再报错才有意义。
  raw = raw.replace(/[\u200B-\u200D\uFEFF]/g, '')      // 零宽字符
           .replace(/[\u201C\u201D]/g, '"')             // 中文双引号
           .replace(/[\u2018\u2019]/g, "'")             // 中文单引号
           .trim();
  var i0 = raw.indexOf('{'), i1 = raw.lastIndexOf('}');
  if (i0 > 0 || (i1 >= 0 && i1 < raw.length - 1)) raw = raw.slice(i0, i1 + 1);   // 掐掉前后多余的话

  var o;
  try { o = JSON.parse(raw); } catch (e) {
    // 报出到底哪里不对——光说"不是备份"帮不上忙
    var head = raw.slice(0, 24), tail = raw.slice(-24);
    var why;
    if (!raw) why = '框里是空的';
    else if (raw.charAt(0) !== '{') why = '开头不是 {，而是「' + head + '…」';
    else if (raw.charAt(raw.length - 1) !== '}') why = '结尾不是 }，最后是「…' + tail + '」——<b>多半是复制时被截断了</b>';
    else why = '中间有损坏（' + String(e.message).slice(0, 40) + '）';
    $('#m2').innerHTML = '<span class="bad">读不出来</span>：' + why +
      '<br><span class="tip">收到 ' + raw.length + ' 个字符。' +
      '如果字符数明显少于导出时提示的数目，就是没复制全——' +
      '改用「存成文件」再用「从文件选」，或分两次复制。</span>';
    return;
  }
  if (!o || o.t !== 'yishutang-backup' || !o.data || typeof o.data !== 'object') {
    $('#m2').innerHTML = '<span class="bad">这不是易术堂的备份文件</span>';
    return;
  }
  var keys = Object.keys(o.data);
  if (!keys.length) { $('#m2').innerHTML = '<span class="bad">这份备份是空的</span>'; return; }
  // 覆盖是不可逆的，先让人看清楚要写多少、其中多少会盖掉现有的
  var over = keys.filter(function (k) { return ls.getItem(k) !== null; }).length;
  var msg = '这份备份导出于 ' + (o.at || '未知时间') + '，共 ' + keys.length + ' 项。\n' +
    (over ? '其中 ' + over + ' 项本机已有，会被覆盖。\n' : '') + '确定恢复吗？';
  if (!window.confirm(msg)) { $('#m2').textContent = '已取消，什么都没动。'; return; }
  var n = 0, bad = 0;
  keys.forEach(function (k) {
    if (SKIP.test(k)) return;            // 备份里若混进缓存键，恢复时照样跳过
    try {
      var v = o.data[k];
      // v2 起 value 存的是对象（省转义），v1 存的是字符串——两种都要吃得下
      ls.setItem(k, typeof v === 'string' ? v : JSON.stringify(v));
      n++;
    } catch (e) { bad++; }
  });
  render();
  $('#m2').innerHTML = '<span class="ok">已恢复 ' + n + ' 项</span>' +
    (bad ? '，<span class="bad">' + bad + ' 项写不进去（存储空间不足？）</span>' : '') +
    '。<b><a href="./">回导航看看</a></b>';
};
</script>
</body>
</html>
